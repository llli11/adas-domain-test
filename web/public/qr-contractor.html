<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>外委人员扫码登记</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; padding: 20px; }
    .container { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h2 { text-align: center; margin-bottom: 20px; color: #333; }
    .info { background: #f0f9ff; border-left: 4px solid #1890ff; padding: 12px; margin-bottom: 20px; border-radius: 4px; }
    .info p { margin: 4px 0; color: #555; font-size: 14px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 14px; color: #333; font-weight: 500; }
    input, select { width: 100%; padding: 10px 12px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 14px; }
    input:focus, select:focus { outline: none; border-color: #1890ff; }
    .btn-group { display: flex; gap: 12px; margin-top: 20px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; transition: opacity 0.2s; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-primary { background: #1890ff; color: #fff; }
    .btn-success { background: #52c41a; color: #fff; }
    .btn-warning { background: #faad14; color: #fff; }
    .btn-error { background: #ff4d4f; color: #fff; }
    .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .tab { flex: 1; padding: 10px; text-align: center; background: #f0f0f0; border-radius: 6px; cursor: pointer; font-size: 14px; }
    .tab.active { background: #1890ff; color: #fff; }
    .section { display: none; }
    .section.active { display: block; }
    .message { padding: 10px; border-radius: 6px; margin-bottom: 16px; font-size: 14px; display: none; }
    .message.success { background: #f6ffed; border: 1px solid #b7eb8f; color: #52c41a; display: block; }
    .message.error { background: #fff2f0; border: 1px solid #ffccc7; color: #ff4d4f; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <h2>外委人员扫码登记</h2>
    <div id="message" class="message"></div>

    <div class="info" id="staffInfo">
      <p>正在加载人员信息...</p>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('depart')">出发/返回</div>
      <div class="tab" onclick="switchTab('worklog')">工作日志</div>
      <div class="tab" onclick="switchTab('leave')">请假</div>
    </div>

    <!-- 出发/返回 -->
    <div id="departSection" class="section active">
      <div class="form-group">
        <label>当前车辆</label>
        <input type="text" id="vehicleName" placeholder="请输入车辆名称">
      </div>
      <div class="form-group">
        <label>任务类型</label>
        <select id="taskType">
          <option value="泊车">泊车</option>
          <option value="行车">行车</option>
          <option value="LO">LO</option>
          <option value="L1">L1</option>
        </select>
      </div>
      <div class="btn-group">
        <button class="btn-success" onclick="submitAction('depart')">出发</button>
        <button class="btn-primary" onclick="submitAction('return')">返回</button>
      </div>
    </div>

    <!-- 工作日志 -->
    <div id="worklogSection" class="section">
      <div class="form-group">
        <label>下班时间</label>
        <input type="text" id="checkOutTime" placeholder="18:00">
      </div>
      <div class="form-group">
        <label>打卡截图URL</label>
        <input type="text" id="checkOutImage" placeholder="图片链接">
      </div>
      <div class="form-group">
        <label>正常工时</label>
        <input type="number" id="normalHours" value="8" step="0.5">
      </div>
      <div class="form-group">
        <label>加班工时</label>
        <input type="number" id="overtimeHours" value="0" step="0.5">
      </div>
      <div class="form-group">
        <label>工作内容</label>
        <select id="workContent">
          <option value="泊车">泊车</option>
          <option value="行车">行车</option>
        </select>
      </div>
      <div class="form-group">
        <label>今日车型项目</label>
        <select id="workProjectId">
          <option value="">请选择</option>
        </select>
      </div>
      <div class="form-group">
        <label>垫付费用</label>
        <input type="number" id="advancePayment" value="0" step="0.01">
      </div>
      <div class="form-group">
        <label>垫付证明图片URL</label>
        <input type="text" id="advancePaymentImage" placeholder="图片链接">
      </div>
      <button class="btn-primary" style="width:100%;" onclick="submitWorkLog()">提交工作日志</button>
    </div>

    <!-- 请假 -->
    <div id="leaveSection" class="section">
      <div class="form-group">
        <label>请假日期</label>
        <input type="date" id="leaveDate">
      </div>
      <div class="form-group">
        <label>请假类型</label>
        <select id="leaveType">
          <option value="事假">事假</option>
          <option value="病假">病假</option>
          <option value="年假">年假</option>
        </select>
      </div>
      <div class="form-group">
        <label>请假原因</label>
        <input type="text" id="leaveReason" placeholder="请输入原因">
      </div>
      <button class="btn-warning" style="width:100%;" onclick="submitLeave()">提交请假申请</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const API_BASE = window.location.origin + '/api/v1';

    if (!token) {
      showMessage('缺少二维码参数，请重新扫描', 'error');
    } else {
      loadInfo();
      loadProjects();
    }

    function showMessage(text, type) {
      const el = document.getElementById('message');
      el.textContent = text;
      el.className = 'message ' + type;
      setTimeout(() => { el.className = 'message'; }, 3000);
    }

    async function request(url, options = {}) {
      const res = await fetch(url, {
        headers: { 'Content-Type': 'application/json' },
        ...options,
      });
      return res.json();
    }

    async function loadInfo() {
      const res = await request(API_BASE + '/contractor/qr/info?token=' + encodeURIComponent(token));
      if (res.code === 200 && res.data) {
        const d = res.data;
        document.getElementById('staffInfo').innerHTML = `
          <p><strong>姓名：</strong>${d.name || ''}</p>
          <p><strong>属性：</strong>${d.type || ''}</p>
          <p><strong>公司：</strong>${d.company || ''}</p>
          <p><strong>当前状态：</strong>${d.task_status || ''}</p>
        `;
      } else {
        showMessage(res.msg || '加载失败', 'error');
      }
    }

    async function loadProjects() {
      const res = await request(API_BASE + '/dept/list');
      if (res.code === 200 && res.data) {
        const select = document.getElementById('workProjectId');
        res.data.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d.id;
          opt.textContent = d.name;
          select.appendChild(opt);
        });
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById(tab + 'Section').classList.add('active');
    }

    async function submitAction(action) {
      const vehicleName = document.getElementById('vehicleName').value;
      const taskType = document.getElementById('taskType').value;
      if (!vehicleName) { showMessage('请输入车辆名称', 'error'); return; }
      const endpoint = action === 'depart' ? '/contractor/qr/depart' : '/contractor/qr/return';
      const res = await request(API_BASE + endpoint, {
        method: 'POST',
        body: JSON.stringify({ token, vehicle_name: vehicleName, task_type: taskType, action }),
      });
      if (res.code === 200) {
        showMessage(res.msg || '操作成功', 'success');
        loadInfo();
      } else {
        showMessage(res.msg || '操作失败', 'error');
      }
    }

    async function submitWorkLog() {
      const payload = {
        token,
        check_out_time: document.getElementById('checkOutTime').value,
        check_out_image: document.getElementById('checkOutImage').value,
        normal_hours: parseFloat(document.getElementById('normalHours').value) || 8,
        overtime_hours: parseFloat(document.getElementById('overtimeHours').value) || 0,
        work_content: document.getElementById('workContent').value,
        project_id: document.getElementById('workProjectId').value || null,
        advance_payment: parseFloat(document.getElementById('advancePayment').value) || 0,
        advance_payment_image: document.getElementById('advancePaymentImage').value,
      };
      const res = await request(API_BASE + '/contractor/qr/worklog', {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      if (res.code === 200) {
        showMessage(res.msg || '提交成功', 'success');
      } else {
        showMessage(res.msg || '提交失败', 'error');
      }
    }

    async function submitLeave() {
      const payload = {
        token,
        leave_date: document.getElementById('leaveDate').value,
        leave_type: document.getElementById('leaveType').value,
        reason: document.getElementById('leaveReason').value,
      };
      const res = await request(API_BASE + '/contractor/qr/leave', {
        method: 'POST',
        body: JSON.stringify(payload),
      });
      if (res.code === 200) {
        showMessage(res.msg || '提交成功', 'success');
      } else {
        showMessage(res.msg || '提交失败', 'error');
      }
    }
  </script>
</body>
</html>
